# Dokploy-managed compose (sourceType: raw)
# go-multi-warp managed mode with Cloudflare WARP client inside the container
services:
  go-multi-warp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "11080:11080"
      - "18080:18080"
      - "9090:9090"
    environment:
      MULTI_WARP_MODE: managed
      WARP_INSTANCES: "5"
      MULTI_WARP_INSTANCES: "5"
      PROXY_USER: user
      PROXY_PASS: pass
      PROXY_MAX_CONN: "500"
      RUST_LOG: info
    volumes:
      - go-multi-warp-data:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  go-multi-warp-data:
