# Dokploy-managed compose (sourceType: raw)
# go-multi-warp managed mode with Cloudflare WARP client inside the container
services:
  go-multi-warp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "11080:11080"
      - "18080:18080"
      - "9090:9090"
    environment:
      MULTI_WARP_MODE: managed
      WARP_INSTANCES: "10"
      MULTI_WARP_INSTANCES: "10"
      MULTI_WARP_STRATEGY: round_robin
      MULTI_WARP_SOCKS: "0.0.0.0:11080"
      MULTI_WARP_HTTP: "0.0.0.0:18080"
      MULTI_WARP_ADMIN: "0.0.0.0:9090"
      PROXY_USER: user
      PROXY_PASS: pass
      PROXY_MAX_CONN: "1000"
      # Comma-separated, 1 key per instance for unique IPv4
      WARP_LICENSE_KEYS: ${WARP_LICENSE_KEYS:-}
      MULTI_WARP_FORCE_REREGISTER: ${MULTI_WARP_FORCE_REREGISTER:-false}
      RUST_LOG: info
    volumes:
      - go-multi-warp-data:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  go-multi-warp-data:
